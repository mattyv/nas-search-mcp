services:
  nas-search:
    build: .
    image: nas-search-mcp:local
    restart: unless-stopped
    init: true
    user: "${NAS_UID:-1026}:${NAS_GID:-100}"
    ports:
      - "${NAS_BIND_IP:-127.0.0.1}:8080:8080"
      - "127.0.0.1:8082:8082"
    environment:
      NAS_TOKEN: ${NAS_TOKEN:?Set a random token of at least 24 characters in .env}
      NAS_LISTEN: ":8080"
      NAS_OAUTH_LISTEN: ":8082"
      NAS_OAUTH_ISSUER: "${NAS_OAUTH_ISSUER:-}"
      NAS_OAUTH_CLIENT_ID: "${NAS_OAUTH_CLIENT_ID:-nas-claude}"
      NAS_OAUTH_PASSWORD_HASH: "${NAS_OAUTH_PASSWORD_HASH:-}"
      NAS_OAUTH_CLIENT_SECRET_HASH: "${NAS_OAUTH_CLIENT_SECRET_HASH:-}"
      NAS_OAUTH_DB: /data/oauth.sqlite3
      NAS_OAUTH_LOCAL_REDIRECTS: "${NAS_OAUTH_LOCAL_REDIRECTS:-}"
      NAS_DOWNLOAD_URL: "${NAS_DOWNLOAD_URL:-}"
      NAS_DOWNLOAD_LINK_MINUTES: "${NAS_DOWNLOAD_LINK_MINUTES:-10}"
      NAS_ALLOWED_FOLDERS: "${NAS_ALLOWED_FOLDERS:-}"
      NAS_DENIED_FOLDERS: "${NAS_DENIED_FOLDERS:-}"
      NAS_UPGRADE_DIR: "${NAS_UPGRADE_DIR:-}"
      NAS_ROOT: /files
      NAS_DATA: /data
      NAS_SEMANTIC: "true"
      NAS_MODEL_KEEPALIVE_MINUTES: "${NAS_MODEL_KEEPALIVE_MINUTES:-5}"
      NAS_PHOTOS: "${NAS_PHOTOS:-false}"
      NAS_OCR: "${NAS_OCR:-true}"
      OMP_THREAD_LIMIT: "1"
      NAS_SCAN_INTERVAL: "300"
      NAS_VEC_EXTENSION: /opt/vec0.so
      NAS_WORKER: /app/worker/worker.py
      GOMEMLIMIT: 128MiB
      GOMAXPROCS: "1"
      HOME: /data
      HF_HOME: /data/models/huggingface
    volumes:
      - "${NAS_MATTHEW_PATH:-/volume1/Matthew/Documents}:/files/Matthew:ro"
      - "${NAS_CODE_PATH:-/volume1/Matthew/Code}:/files/Code:ro"
      - "${NAS_PHOTOS_PATH:-/volume1/homes/matt/Photos}:/files/Photos:ro"
      - "${NAS_INDEX_PATH:-/volume1/docker/nas-search/data}:/data"
      - "${NAS_UPGRADE_PATH:-/volume1/docker/nas-search/upgrades}:/upgrades"
    mem_limit: 1g
    memswap_limit: 1g
    # Synology's kernel lacks CFS quotas; confine execution to one CPU instead.
    cpuset: "${NAS_CPUSET:-0}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, /app/nas-search, health]
      interval: 30s
      timeout: 5s
      retries: 3
