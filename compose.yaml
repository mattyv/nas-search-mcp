services:
  nas-search:
    build: .
    image: nas-search-mcp:local
    restart: unless-stopped
    init: true
    user: "${NAS_UID:-1000}:${NAS_GID:-1000}"
    ports:
      - "${NAS_BIND_IP:-127.0.0.1}:8080:8080"
      - "127.0.0.1:8082:8082"
    environment:
      NAS_TOKEN: ${NAS_TOKEN:?Set a random token of at least 24 characters in .env}
      NAS_LISTEN: ":8080"
      NAS_OAUTH_LISTEN: ":8082"
      NAS_OAUTH_ISSUER: "${NAS_OAUTH_ISSUER:-}"
      NAS_OAUTH_CLIENT_ID: "${NAS_OAUTH_CLIENT_ID:-nas-claude}"
      NAS_OAUTH_PASSWORD_HASH: "${NAS_OAUTH_PASSWORD_HASH:-}"
      NAS_OAUTH_CLIENT_SECRET_HASH: "${NAS_OAUTH_CLIENT_SECRET_HASH:-}"
      NAS_OAUTH_DB: /data/oauth.sqlite3
      NAS_OAUTH_LOCAL_REDIRECTS: "${NAS_OAUTH_LOCAL_REDIRECTS:-}"
      NAS_OAUTH_CHATGPT_REDIRECT: "${NAS_OAUTH_CHATGPT_REDIRECT:-}"
      NAS_DOWNLOAD_URL: "${NAS_DOWNLOAD_URL:-}"
      NAS_DOWNLOAD_LINK_MINUTES: "${NAS_DOWNLOAD_LINK_MINUTES:-10}"
      NAS_ALLOWED_FOLDERS: "${NAS_ALLOWED_FOLDERS:-}"
      NAS_DENIED_FOLDERS: "${NAS_DENIED_FOLDERS:-}"
      NAS_UPLOAD_ENABLED: "${NAS_UPLOAD_ENABLED:-false}"
      NAS_UPLOAD_INDEXED_DESTINATIONS: "${NAS_UPLOAD_INDEXED_DESTINATIONS:-false}"
      NAS_UPLOAD_WRITER_SOCKET: /data/upload-ipc/upload.sock
      NAS_MEMORY_ENABLED: "${NAS_MEMORY_ENABLED:-false}"
      NAS_MEMORY_SOCKET: /data/memory-ipc/memory.sock
      NAS_MEMORY_SCOPES: "${NAS_MEMORY_SCOPES:-personal}"
      # No default here: the service picks enroll, or off for an IP-address issuer.
      NAS_OAUTH_PASSKEYS: "${NAS_OAUTH_PASSKEYS:-}"
      NAS_EDITOR_ORIGIN: "${NAS_EDITOR_ORIGIN:-}"
      NAS_UPGRADE_DIR: "${NAS_UPGRADE_DIR:-}"
      # The installer adds a read-only socket-directory bind only when configured.
      NAS_SYNOLOGY_PHOTOS_SOCKET: "${NAS_SYNOLOGY_PHOTOS_SOCKET:-}"
      NAS_ROOT: /files
      NAS_DATA: /data
      NAS_SEMANTIC: "true"
      NAS_MODEL_KEEPALIVE_MINUTES: "${NAS_MODEL_KEEPALIVE_MINUTES:-5}"
      NAS_WORKER_MAX_RSS_MIB: "${NAS_WORKER_MAX_RSS_MIB:-600}"
      NAS_PHOTOS: "${NAS_PHOTOS:-false}"
      NAS_OCR: "${NAS_OCR:-true}"
      OMP_THREAD_LIMIT: "1"
      NAS_SCAN_INTERVAL: "300"
      NAS_SCAN_FILE_DELAY_SECONDS: "${NAS_SCAN_FILE_DELAY_SECONDS:-2}"
      NAS_VEC_EXTENSION: /opt/vec0.so
      NAS_WORKER: /app/worker/worker.py
      GOMEMLIMIT: 128MiB
      GOMAXPROCS: "1"
      HOME: /data
      HF_HOME: /data/models/huggingface
    volumes:
      - "${NAS_DOCUMENTS_PATH:-/volume1/shared-documents}:/files/${NAS_DOCUMENTS_LABEL:-Documents}:ro"
      - "${NAS_CODE_PATH:-/volume1/shared-code}:/files/Code:ro"
      - "${NAS_PHOTOS_PATH:-/volume1/shared-photos}:/files/Photos:ro"
      - "${NAS_INDEX_PATH:-/volume1/app-data/nas-search/index}:/data"
      - "${NAS_UPGRADE_PATH:-/volume1/app-data/nas-search/upgrades}:/upgrades"
    mem_limit: 1g
    memswap_limit: 1g
    # Synology's kernel has no CFS quota, so a cpuset cannot cap CPU time. Use both
    # cores so Go, SQLite, Python, pdftoppm and tesseract overlap, and use low
    # shares so DSM wins under contention. NAS_CPUSET=0 restores single-core pinning.
    cpuset: "${NAS_CPUSET:-0-1}"
    cpu_shares: ${NAS_CPU_SHARES:-512}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, /app/nas-search, health]
      interval: 30s
      timeout: 5s
      retries: 3

  nas-upload-writer:
    profiles: [indexed-upload]
    image: nas-search-mcp:local
    command: [upload-writer]
    restart: unless-stopped
    init: true
    network_mode: none
    user: "${NAS_UID:-1000}:${NAS_GID:-1000}"
    environment:
      NAS_ROOT: /write
      NAS_UPLOAD_WRITER_SOCKET: /ipc/upload.sock
      NAS_ALLOWED_FOLDERS: "${NAS_ALLOWED_FOLDERS:-}"
      NAS_DENIED_FOLDERS: "${NAS_DENIED_FOLDERS:-}"
    volumes:
      - "${NAS_DOCUMENTS_PATH:-/volume1/shared-documents}:/write/${NAS_DOCUMENTS_LABEL:-Documents}:rw"
      - "${NAS_CODE_PATH:-/volume1/shared-code}:/write/Code:rw"
      - "${NAS_PHOTOS_PATH:-/volume1/shared-photos}:/write/Photos:rw"
      - "${NAS_INDEX_PATH:-/volume1/app-data/nas-search/index}/upload-ipc:/ipc:rw"
    mem_limit: 96m
    memswap_limit: 96m
    # Same CPU policy as nas-search; see the comment there.
    cpuset: "${NAS_CPUSET:-0-1}"
    cpu_shares: ${NAS_CPU_SHARES:-512}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: [CMD, /app/nas-search, upload-writer-health]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional shared memory (profile "memory"). The editor port is localhost only;
  # expose it privately with `tailscale serve`. It sits on its own network so the
  # search container cannot reach the editor port, and keeps outbound HTTPS for the
  # optional Jev classifier.
  nas-memory:
    profiles: [memory]
    image: nas-search-mcp:local
    command: [memory-service]
    restart: unless-stopped
    init: true
    networks: [memory]
    user: "${NAS_UID:-1000}:${NAS_GID:-1000}"
    ports:
      - "127.0.0.1:${NAS_EDITOR_PORT:-8083}:8083"
    environment:
      NAS_MEMORY_DB: /memory/memory.sqlite3
      NAS_MEMORY_LISTEN_SOCKET: /ipc/memory.sock
      NAS_MEMORY_SCOPES: "${NAS_MEMORY_SCOPES:-personal}"
      NAS_EDITOR_LISTEN: ":8083"
      NAS_EDITOR_OWNER: "${NAS_EDITOR_OWNER:-}"
      NAS_EDITOR_ORIGIN: "${NAS_EDITOR_ORIGIN:-}"
      NAS_JEV_API_KEY: "${NAS_JEV_API_KEY:-}"
      NAS_JEV_URL: "${NAS_JEV_URL:-https://api.typesafe.ai}"
      NAS_JEV_MODEL: "${NAS_JEV_MODEL:-jev-latest}"
      NAS_JEV_SCOPES: "${NAS_JEV_SCOPES:-personal}"
      NAS_MEMORY_ACCEPT_AT: "${NAS_MEMORY_ACCEPT_AT:-900}"
      NAS_MEMORY_REJECT_AT: "${NAS_MEMORY_REJECT_AT:-100}"
    volumes:
      - "${NAS_MEMORY_PATH:-/volume1/app-data/nas-search/memory}:/memory:rw"
      - "${NAS_INDEX_PATH:-/volume1/app-data/nas-search/index}/memory-ipc:/ipc:rw"
    mem_limit: 128m
    memswap_limit: 128m
    # Same CPU policy as nas-search; see the comment there.
    cpuset: "${NAS_CPUSET:-0-1}"
    cpu_shares: ${NAS_CPU_SHARES:-512}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: [CMD, /app/nas-search, memory-health]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  memory: {}
